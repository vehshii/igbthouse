<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order — IGBT House</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f3f4f6; color: #1f2937; min-height: 100vh; }
  .topbar { background: #b91c1c; color: #fff; padding: 22px 16px; text-align: center; }
  .topbar h1 { font-size: 22px; letter-spacing: 3px; }
  .topbar p { font-size: 11px; letter-spacing: 2px; color: #fecaca; margin-top: 4px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .card { background: #fff; border-radius: 12px; padding: 22px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.07); margin-bottom: 16px; }
  .card h2 { font-size: 18px; margin-bottom: 6px; }
  .card .sub { font-size: 13px; color: #6b7280; margin-bottom: 14px; line-height: 1.5; }
  .row { display: flex; gap: 8px; }
  input#orderId { flex: 1; padding: 13px 12px; font-size: 16px; border: 2px solid #e5e7eb; border-radius: 8px; text-transform: uppercase; }
  input#orderId:focus { outline: none; border-color: #b91c1c; }
  button#trackBtn { background: #b91c1c; color: #fff; border: none; border-radius: 8px; padding: 0 22px; font-size: 15px; font-weight: bold; cursor: pointer; }
  button#trackBtn:disabled { background: #d1d5db; cursor: wait; }
  .meta { font-size: 13px; color: #4b5563; margin-top: 14px; line-height: 1.7; }
  .meta b { color: #111827; }
  .items { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-top: 10px; font-size: 13px; line-height: 1.7; white-space: pre-line; }
  /* timeline */
  .tl { list-style: none; margin-top: 6px; }
  .tl li { position: relative; padding: 0 0 26px 38px; }
  .tl li:last-child { padding-bottom: 4px; }
  .tl li::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: -2px; width: 3px; background: #e5e7eb; border-radius: 2px; }
  .tl li:last-child::before { display: none; }
  .tl .dot { position: absolute; left: 2px; top: 2px; width: 24px; height: 24px; border-radius: 50%; background: #e5e7eb; color: #fff; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
  .tl li.done .dot { background: #16a34a; }
  .tl li.done::before { background: #16a34a; }
  .tl li.now .dot { background: #b91c1c; box-shadow: 0 0 0 5px #fee2e2; }
  .tl .t { font-size: 15px; font-weight: bold; }
  .tl li.done .t, .tl li.now .t { color: #111827; }
  .tl li.todo .t { color: #9ca3af; font-weight: normal; }
  .tl .d { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .tcs { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 14px; margin-top: 14px; }
  .tcs .lbl { font-size: 11px; letter-spacing: 1px; color: #1d4ed8; }
  .tcs .num { font-size: 20px; font-weight: bold; color: #1e3a8a; margin: 4px 0; letter-spacing: 1px; }
  .tcs .hint { font-size: 12px; color: #4b5563; }
  .msg { text-align: center; padding: 26px 10px; }
  .msg .big { font-size: 44px; margin-bottom: 10px; }
  .msg h3 { font-size: 17px; margin-bottom: 8px; }
  .msg p { font-size: 13px; color: #6b7280; line-height: 1.6; }
  .foot { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 8px; line-height: 1.6; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="topbar">
  <h1>IGBT HOUSE</h1>
  <p>VFD SPARE PARTS &mdash; PAKISTAN</p>
</div>

<div class="wrap">
  <div class="card">
    <h2>Track Your Order</h2>
    <p class="sub">Enter the Order ID from your confirmation email (for example: IH-MVCV1FZQ).</p>
    <div class="row">
      <input id="orderId" placeholder="IH-XXXXXX" autocomplete="off" spellcheck="false">
      <button id="trackBtn" type="button">Track</button>
    </div>
  </div>

  <div class="card hidden" id="resultCard">
    <div id="resultBody"></div>
  </div>

  <div class="card hidden" id="msgCard">
    <div class="msg" id="msgBody"></div>
  </div>

  <p class="foot">IGBT House &mdash; Industrial VFD Spare Parts, Pakistan<br>Prices are confirmed after checking the exact model, part code and stock.</p>
</div>

<script>
// ====== CONFIG: Apps Script web app URL (same as order backend) ======
var API = 'https://script.google.com/macros/s/AKfycbxnAXaUVjVN9U17Z7p2g-M6yXIUaXHiuYyWhrFJEyP7AhN9QHIz3JPSWSumS1BdAjnWWA/exec';

var STAGES = [
  { key: 'placed',     title: 'Order placed',    desc: 'We received your order.' },
  { key: 'confirmed',  title: 'Confirmed',       desc: 'We confirmed availability and delivery details with you on WhatsApp.' },
  { key: 'dispatched', title: 'Dispatched',      desc: 'Your parcel is on its way via courier.' },
  { key: 'delivered',  title: 'Delivered',       desc: 'Parcel delivered. Thank you for shopping with IGBT House!' }
];

function stageIndex(status, tracking) {
  status = String(status || '').trim().toLowerCase();
  if (status === 'cancelled') return -2;
  if (status === 'return' || status === 'returned') return -3;
  if (status === 'delivered' || status === 'complete' || status === 'completed') return 3;
  if (status === 'dispatched' || status === 'shipped') return 2;
  if (status === 'confirmed') return 1;
  if (tracking) return 2; // tracking number present => parcel dispatched
  return 0; // pending => placed
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fetchStatus(orderId) {
  return new Promise(function (resolve, reject) {
    var cb = 'igbtTrackCb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    var s = document.createElement('script');
    var done = false;
    function cleanup() { if (done) return; done = true; clearTimeout(t); try { delete window[cb]; } catch (e) {} s.remove(); }
    var t = setTimeout(function () { cleanup(); reject(new Error('timeout')); }, 15000);
    window[cb] = function (data) { cleanup(); resolve(data); };
    s.onerror = function () { cleanup(); reject(new Error('network')); };
    s.src = API + '?orderId=' + encodeURIComponent(orderId) + '&callback=' + cb;
    document.body.appendChild(s);
  });
}

function renderTimeline(idx) {
  var html = '<ul class="tl">';
  STAGES.forEach(function (st, i) {
    var cls = i < idx ? 'done' : (i === idx ? 'now' : 'todo');
    var mark = i < idx ? '&#10003;' : (i + 1);
    html += '<li class="' + cls + '"><span class="dot">' + mark + '</span>' +
            '<div class="t">' + st.title + '</div><div class="d">' + st.desc + '</div></li>';
  });
  return html + '</ul>';
}

function showMsg(big, title, text) {
  document.getElementById('resultCard').classList.add('hidden');
  var c = document.getElementById('msgCard');
  c.classList.remove('hidden');
  document.getElementById('msgBody').innerHTML =
    '<div class="big">' + big + '</div><h3>' + title + '</h3><p>' + text + '</p>';
  c.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showResult(data) {
  document.getElementById('msgCard').classList.add('hidden');
  var c = document.getElementById('resultCard');
  c.classList.remove('hidden');
  var idx = stageIndex(data.status, data.tracking);
  var html = '';
  if (idx === -2) {
    html = '<div class="msg"><div class="big">&#10060;</div><h3>Order cancelled</h3>' +
           '<p>Order <b>' + esc(data.orderId) + '</b> was cancelled. Contact us on WhatsApp if you have questions.</p></div>';
  } else if (idx === -3) {
    html = '<div class="msg"><div class="big">&#8617;</div><h3>Order returned</h3>' +
           '<p>Order <b>' + esc(data.orderId) + '</b> was returned. Contact us on WhatsApp for details.</p></div>';
  } else {
    html = '<h2>Order ' + esc(data.orderId) + '</h2>' +
           '<p class="sub">Placed on ' + esc(data.date || '-') + '</p>' +
           renderTimeline(idx);
    if (data.items) html += '<div class="meta"><b>Items:</b></div><div class="items">' + esc(data.items) + '</div>';
    if (data.tracking) {
      html += '<div class="tcs"><div class="lbl">COURIER TRACKING NUMBER</div>' +
              '<div class="num">' + esc(data.tracking) + '</div>' +
              '<div class="hint">Enter this number on your courier&rsquo;s website to see live parcel location.</div></div>';
    } else if (idx >= 2) {
      html += '<div class="meta">Courier tracking number will appear here once assigned.</div>';
    }
  }
  document.getElementById('resultBody').innerHTML = html;
  c.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function normalize(id) {
  id = String(id || '').trim().toUpperCase().replace(/\s+/g, '');
  if (id && id.indexOf('IH-') !== 0) id = 'IH-' + id;
  return id;
}

var input = document.getElementById('orderId');
var btn = document.getElementById('trackBtn');

function doTrack() {
  var id = normalize(input.value);
  input.value = id;
  if (!id || id === 'IH-') { showMsg('&#128269;', 'Enter your Order ID', 'The Order ID is in your confirmation email, for example: IH-MVCV1FZQ.'); return; }
  btn.disabled = true; btn.textContent = '...';
  document.getElementById('msgCard').classList.add('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  fetchStatus(id).then(function (data) {
    btn.disabled = false; btn.textContent = 'Track';
    if (!data || data.ok === false) { showMsg('&#9888;', 'Something went wrong', 'Please try again in a minute.'); return; }
    if (!data.found) { showMsg('&#128269;', 'Order not found', 'No order found for <b>' + esc(id) + '</b>. Please copy the Order ID exactly from your confirmation email and try again.'); return; }
    showResult(data);
  }).catch(function () {
    btn.disabled = false; btn.textContent = 'Track';
    showMsg('&#9888;', 'Connection problem', 'Could not reach the tracking service. Check your internet and try again.');
  });
}

btn.addEventListener('click', doTrack);
input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doTrack(); });

// auto-track from ?id= link in confirmation email
(function () {
  try {
    var q = new URLSearchParams(window.location.search).get('id');
    if (q) { input.value = q; doTrack(); }
  } catch (e) {}
})();
</script>
</body>
</html>
